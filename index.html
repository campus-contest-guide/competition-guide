<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#24564a"><meta name="description" content="查询大学生赛事、报名时间、参赛要求与官方通知。"><title>赛事发现 · 发现下一场可能</title><link rel="stylesheet" href="theme.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2324564a'/%3E%3Cpath d='M7 29 17 12 23 22 28 15 34 29Z' fill='%23efeddf'/%3E%3C/svg%3E"></head>
<body><header class="header"><a class="brand" href="#"><span class="logo" aria-hidden="true">竞</span><span>赛事发现<small>DISCOVER</small></span></a><nav aria-label="主导航"><button class="nav active" data-view="all">发现赛事</button><button class="nav" data-view="saved">我的收藏 <span id="savedCount">0</span></button></nav><span class="header-note">每一次探索，都有新的可能</span></header>
<main><section class="hero"><div class="hero-text"><p class="eyebrow"><span></span> EXPLORE YOUR NEXT CHALLENGE</p><h1>山外有山，<br>去发现下一场<span>可能。</span></h1><p class="hero-caption">寻找热爱的方向，让每一份创意都有舞台。</p><form id="searchForm" class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索赛事名称、主办方或关键词" aria-label="搜索赛事"><button type="submit">查找赛事 <span>↗</span></button></form><div class="popular"><span>热门搜索</span><button data-search="挑战杯">挑战杯</button><button data-search="互联网+">互联网+</button><button data-search="商科">商科竞赛</button><button data-search="设计">设计竞赛</button></div></div><div class="hero-seal" aria-hidden="true">向<br>山<br>而<br>行</div><span class="scene-caption" aria-hidden="true">青绿入画 · 创意生长</span></section>
<section class="catalog" id="catalog"><div class="catalog-title"><div><p class="eyebrow">COMPETITIONS</p><h2 id="listTitle">发现赛事 <span id="count" aria-live="polite"></span></h2></div><p class="updated">最近更新 <time id="verified"></time></p></div><div class="filter-panel"><div class="categories" id="categories" aria-label="赛事类别"></div><div class="filter-row"><div class="selects"><label>地区 <select id="region" aria-label="地区"><option value="">全部地区</option><option value="全国">全国</option><option value="北京">北京相关</option></select></label><label>状态 <select id="status" aria-label="报名状态"><option value="">全部状态</option><option>正在报名</option><option>即将开始</option><option>下一届待通知</option></select></label><label>排序 <select id="sort" aria-label="赛事排序"><option value="date">截止时间</option><option value="name">赛事名称</option></select></label></div><button class="reset" id="reset">重置筛选 ↻</button></div></div><div id="results" aria-live="polite"></div></section>
<footer><a class="footer-brand" href="#">赛事发现</a><span>日期以北京时间为准，报名安排请以官方通知为准。</span><span>收藏仅保存在当前浏览器</span></footer></main>
<dialog id="detail"><button id="close" aria-label="关闭详情">×</button><div id="detailBody"></div></dialog><div class="toast" id="toast" role="status"></div><script src="events.js"></script><script src="main.js"></script></body></html>
